name: Application tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            training/ml_requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt pytest

      - name: Compile application and training modules
        run: python -m compileall -q app training

      - name: Run application and candidate-inference tests
        run: python -m pytest app/tests training/evaluation_results/controlled_stacking/bundle_audit/tests -q

  training-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: training/ml_requirements.txt

      - name: Install ML training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/ml_requirements.txt pytest

      - name: Test leakage-safe Model 3 feature generation
        run: python -m pytest training/tests -q
